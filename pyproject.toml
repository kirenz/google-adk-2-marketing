[project]
name = "google-adk-2-marketing"
version = "0.1.0"
description = "Google ADK 2 im Marketing: Agenten, Werkzeuge und Workflows am Fall Morgenrot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "google-adk==2.13.0",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
